programs:
  whale:
    name: Naver Whale Browser
    disclosure_policy: TBD - operator-provided program scope (update once public channel confirmed)
    assets:
      - name: "Whale browser - latest version (reproducible at time of reporting)"
        priority: In
      - name: "Third-party libraries used ONLY by Whale (not Chromium)"
        priority: In
      - name: "Synchronization"
        priority: In
    out_of_scope:
      - "All Naver web services (*.naver.com, *.navercorp.com)"
      - "Web servers of built-in extensions (Papago, Belli)"
      - "URL preview spoofing in status bar"
      - "Bypassing XSS Auditor"
      - "IETab extension"
      - "SafeBrowsing false positives / false negatives"
    github_orgs:
      - naver

rules:
  passive_first: true          # GET/HEAD reads first; client-side scope: static analysis + repro-first
  max_requests_per_second: 1   # never hammer
  no_doom: true                # no DoS/DDoS
  no_account_creation: true
  no_data_modification: true
  no_pre_disclosure: true
  latest_version_required: true  # bug must reproduce on the LATEST Whale version at report time
  redact_secrets_in_commits: true

# Multi-model ensemble: every hunt run picks a rotation of the 5 models.
models:
  - { id: opencode/big-pickle, name: bigpickle }
  - { id: opencode/nemotron-3-ultra-free, name: nemotron3 }
  - { id: opencode/longcat-2.0-free, name: longcat }
  - { id: opencode/ling-3.0-flash-free, name: ling3 }
  - { id: opencode/laguna-s-2.1-free, name: laguna }
